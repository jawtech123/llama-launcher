[project]
name = "llama-launcher"
version = "1.0.0"
description = "A desktop + CLI application that generates and manages llama-server launch configurations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "paramiko>=3.0.0",
]

[project.scripts]
llama-launcher = "cli.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
