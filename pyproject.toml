[project]
name = "llama-launcher"
version = "2.0.0"
description = "A desktop + CLI application that generates and manages llama-server launch configurations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
llama-launcher = "llama_launcher.cli.main:main"
llama-launcher-gui = "llama_launcher.app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
llama_launcher = ["icons/**/*.png"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_launcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
